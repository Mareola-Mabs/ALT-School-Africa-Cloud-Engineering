- name:  Replace Default Apache Homepage
  hosts: web
  become: true

  tasks:
    - name: Replace Default Homepage
      copy:
        content: |
          <html>
          <head>
              <title>My Custom Page</title>
          </head>
          <body>
              <h1>Hello from Ansible</h1>
              <p>This server is configured by Ibukunola Mabawonku</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
